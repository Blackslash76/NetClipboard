name: Release (gold)

# Pubblica una nuova "gold": al push di un tag vX.Y.Z costruisce il single-file,
# lo firma con Authenticode (SignPath Foundation), lo FIRMA con la chiave privata
# release (secret RELEASE_SIGNING_KEY_B64), genera manifest.json, costruisce e
# firma l'installer, e crea la GitHub Release con tutti gli asset.
#
# Le due firme sono cose diverse e servono entrambe:
#  - Authenticode   -> Windows, SmartScreen e gli antivirus si fidano del binario;
#  - chiave release -> l'app accetta l'aggiornamento solo se viene davvero da noi.
#
# ORDINE OBBLIGATORIO: manifest.json contiene lo SHA-256 dell'exe, quindi va
# generato DOPO la firma Authenticode. Invertirli rompe l'auto-update di tutti
# gli utenti gia' installati (hash non corrispondente -> update rifiutato).
#
# Finche' i secret/variables di SignPath non ci sono, i passi di firma si saltano
# da soli e la release esce non firmata, esattamente come prima.
#
# DUE PUBLISH, di proposito:
#  - publish/      COMPRESSO      -> asset NetClipboard.exe e hash in manifest.json,
#                                    cioe' il file che scaricano gli auto-update.
#  - publish-full/ NON compresso  -> finisce dentro l'installer. Comprimere il bundle
#                                    ne alza l'entropia e lo fa somigliare a un
#                                    eseguibile "packed", una delle euristiche
#                                    antivirus piu' immediate; il file installato
#                                    viene riscansionato a ogni avvio, quindi li'
#                                    conviene pagarla in dimensione (50 -> 112 MB).
#                                    Il setup.exe resta piccolo perche' Inno ricomprime.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  gold:
    runs-on: windows-latest
    env:
      # Solo un flag: il token vero resta nei secrets e lo vedono solo i passi che firmano.
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Versione dal tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versione: $v"

      - name: Publish compresso (asset e auto-update)
        shell: pwsh
        run: >
          dotnet publish src/NetClipboard/NetClipboard.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: Publish non compresso (per l'installer)
        shell: pwsh
        run: >
          dotnet publish src/NetClipboard/NetClipboard.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -o publish-full

      # ----- Firma Authenticode dei due eseguibili -----

      - name: Carica l'exe compresso da firmare
        id: upload-exe
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netclipboard-exe-unsigned
          path: publish/NetClipboard.exe
          if-no-files-found: error

      - name: Firma l'exe compresso (SignPath)
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Carica l'exe non compresso da firmare
        id: upload-exe-full
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netclipboard-exe-full-unsigned
          path: publish-full/NetClipboard.exe
          if-no-files-found: error

      - name: Firma l'exe non compresso (SignPath)
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe-full.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe-full

      - name: Sostituisci con gli eseguibili firmati
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        run: |
          Copy-Item (Join-Path 'signed-exe' 'NetClipboard.exe') (Join-Path 'publish' 'NetClipboard.exe') -Force
          Copy-Item (Join-Path 'signed-exe-full' 'NetClipboard.exe') (Join-Path 'publish-full' 'NetClipboard.exe') -Force
          foreach ($p in @((Join-Path 'publish' 'NetClipboard.exe'), (Join-Path 'publish-full' 'NetClipboard.exe'))) {
            $sig = Get-AuthenticodeSignature $p
            Write-Host "Firma ${p}: $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Firma Authenticode non valida su ${p}: $($sig.Status)" }
          }

      # ----- manifest.json: DOPO la firma, perche' ne contiene lo SHA-256 -----

      - name: Firma e genera manifest.json
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "Manca il secret RELEASE_SIGNING_KEY_B64 (contenuto di .vault/release-signing.key)."
          }
          Set-Content -Path key.b64 -Value $env:SIGNING_KEY -NoNewline
          $exeUrl = "https://github.com/${{ github.repository }}/releases/latest/download/NetClipboard.exe"
          Start-Process -FilePath publish/NetClipboard.exe -Wait -NoNewWindow -ArgumentList @(
            '--sign-release','publish/NetClipboard.exe','${{ steps.ver.outputs.version }}',
            'key.b64', $exeUrl, 'manifest.json', "Release ${{ github.ref_name }}"
          )
          Remove-Item key.b64 -Force
          if (-not (Test-Path manifest.json)) {
            if (Test-Path sign-error.txt) { Get-Content sign-error.txt }
            throw "manifest.json non generato: firma fallita."
          }
          Get-Content manifest.json

      - name: Installa Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Costruisci l'installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            "/DSourceExe=${{ github.workspace }}\publish-full\NetClipboard.exe" `
            installer\NetClipboard.iss
          $setup = "installer\NetClipboard-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $setup)) { throw "Installer non generato" }
          Write-Host "Installer: $setup"

      # ----- Firma Authenticode dell'installer -----
      # E' il primo binario che l'utente scarica: se resta non firmato SmartScreen
      # interviene comunque, per quanto l'exe contenuto sia a posto.

      - name: Carica l'installer da firmare
        id: upload-setup
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netclipboard-setup-unsigned
          path: installer/NetClipboard-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - name: Firma l'installer (SignPath)
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Sostituisci con l'installer firmato
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $name = "NetClipboard-Setup-${{ steps.ver.outputs.version }}.exe"
          Copy-Item (Join-Path 'signed-setup' $name) (Join-Path 'installer' $name) -Force
          $sig = Get-AuthenticodeSignature (Join-Path 'installer' $name)
          Write-Host "Firma installer: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Firma Authenticode non valida sull'installer: $($sig.Status)" }

      - name: Avviso se la release esce non firmata
        if: env.SIGNPATH_CONFIGURED != 'true'
        shell: pwsh
        run: |
          Write-Warning "SignPath non configurato: la release NON sara' firmata Authenticode."
          Write-Warning "Servono il secret SIGNPATH_API_TOKEN e le variables SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG."

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NetClipboard ${{ github.ref_name }}
          files: |
            publish/NetClipboard.exe
            installer/NetClipboard-Setup-*.exe
            manifest.json
          make_latest: true
          generate_release_notes: true

  # ---------------------------------------------------------------- Android ---
  #
  # Gira DOPO 'gold', non insieme: la release la crea quel lavoro, e questo le
  # aggiunge l'APK. Se fallisse, la release Windows resta valida e pubblicata —
  # che e' cio' che si vuole, visto che sono due prodotti con vite proprie.
  #
  # LA CHIAVE DI FIRMA E' PER SEMPRE. Android riconosce un aggiornamento solo se
  # e' firmato con la stessa chiave della versione installata: perderla, o
  # firmarne una con un'altra, significa che nessuno potra' aggiornare — dovranno
  # disinstallare e reinstallare, perdendo i dispositivi accoppiati. Il file .jks
  # va conservato fuori da qui, in piu' di una copia.
  android:
    needs: gold
    runs-on: ubuntu-latest
    env:
      KEYSTORE_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      PLAY_CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Installa il carico di lavoro Android
        run: dotnet workload install android --skip-sign-check

      - name: Versione dal tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Avviso se manca la chiave di firma
        if: env.KEYSTORE_CONFIGURED != 'true'
        run: |
          echo "::warning::ANDROID_KEYSTORE_B64 non configurato: nessun APK pubblicato."
          echo "Servono i secret ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."

      - name: Ricostruisci il portachiavi
        if: env.KEYSTORE_CONFIGURED == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/netclipboard.jks"
          test -s "$RUNNER_TEMP/netclipboard.jks"

      # Una sola compilazione produce sia l'APK sia l'AAB: cosi' cio' che si
      # scarica da qui e cio' che finisce su Play non possono divergere.
      - name: Costruisci APK e AAB firmati
        if: env.KEYSTORE_CONFIGURED == 'true'
        run: |
          dotnet publish src/NetClipboard.Android/NetClipboard.Android.csproj -c Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/netclipboard.jks" \
            -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Raccogli i pacchetti
        if: env.KEYSTORE_CONFIGURED == 'true'
        id: pack
        run: |
          out=src/NetClipboard.Android/bin/Release/net10.0-android36.0/publish
          mkdir -p dist
          # Si prendono ESPLICITAMENTE i file firmati: accanto ce ne sono di non
          # firmati con nome quasi uguale, e un APK non firmato non si installa.
          apk=$(find "$out" -name '*-Signed.apk' | head -1)
          aab=$(find "$out" -name '*-Signed.aab' | head -1)
          test -n "$apk" || { echo "APK firmato non prodotto"; exit 1; }
          test -n "$aab" || { echo "AAB firmato non prodotto"; exit 1; }
          cp "$apk" "dist/NetClipboard-${{ steps.ver.outputs.version }}.apk"
          cp "$aab" "dist/NetClipboard-${{ steps.ver.outputs.version }}.aab"
          echo "aab=dist/NetClipboard-${{ steps.ver.outputs.version }}.aab" >> "$GITHUB_OUTPUT"
          ls -la dist

      # L'APK si aggiunge alla release gia' creata da 'gold': stesso tag, stessa
      # pagina. L'AAB no — su Play si carica, e un AAB scaricato a mano non si
      # installa: pubblicarlo accanto all'APK inviterebbe solo a sbagliare file.
      - name: Aggiungi l'APK alla release
        if: env.KEYSTORE_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetClipboard-*.apk

      - name: Conserva l'AAB come artefatto
        if: env.KEYSTORE_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netclipboard-aab
          path: dist/*.aab
          if-no-files-found: error

      # Canale interno, non produzione: da li' si promuove a mano dopo aver
      # provato il pacchetto davvero pubblicato, che non e' mai identico a
      # quello provato in casa.
      - name: Carica su Google Play (canale interno)
        if: env.KEYSTORE_CONFIGURED == 'true' && env.PLAY_CONFIGURED == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.eulogic.netclipboard
          releaseFiles: ${{ steps.pack.outputs.aab }}
          track: internal
          status: completed
